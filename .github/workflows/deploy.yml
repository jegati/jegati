name: deploy alpha

on:
  push:
    branches: [deploy]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gati-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, audit and activate
    if: github.ref == 'refs/heads/deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: production
    env:
      GATI_PUBLIC_HOST: jamgati.com
      RELEASE_ROOT: reports/local/github-release-${{ github.sha }}
      PACKAGE: reports/local/github-release-${{ github.sha }}.tar.gz
      REMOTE_ROOT: /opt/gati/releases
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Validate private deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          test -n "$CLOUDFLARE_TUNNEL_TOKEN"

      - name: Require successful verification of this exact revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repository = os.environ["GITHUB_REPOSITORY"]
          revision = os.environ["GITHUB_SHA"]
          url = f"https://api.github.com/repos/{repository}/actions/workflows/checks.yml/runs?head_sha={revision}&status=success&per_page=10"
          request = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
              "User-Agent": "gati-deployment-gate",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(request, timeout=20) as response:
              runs = json.load(response).get("workflow_runs", [])
          if not any(run.get("head_sha") == revision and run.get("conclusion") == "success" for run in runs):
              raise SystemExit("this exact revision has no successful local verification run")
          print("Exact revision has a successful local verification run.")
          PY

      - name: Configure verified SSH host access
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"

      - name: Check fresh VPS prerequisites
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          for tool in docker python3 tar gzip xz sha256sum install; do
            command -v "$tool" >/dev/null
          done
          docker info >/dev/null
          docker compose version >/dev/null
          test -w /opt/gati/releases
          test -w /opt/gati/audits
          test -w /opt/gati/releases/.gati-production-runtime
          python3 - <<'PY'
          import ipaddress, json, os, pathlib, shutil, subprocess
          problems = []
          if pathlib.Path('/proc/swaps').read_text().strip().count('\n'):
              problems.append('active host swap')
          resume = pathlib.Path('/sys/power/resume')
          if resume.exists() and resume.read_text().strip() != '0:0':
              problems.append('configured hibernation resume device')
          memory_kib = int(next(line.split()[1] for line in pathlib.Path('/proc/meminfo').read_text().splitlines() if line.startswith('MemTotal:')))
          if memory_kib < 6 * 1024 * 1024:
              problems.append('less than 6 GiB host memory')
          if shutil.disk_usage('/opt/gati').free < 6 * 1024**3:
              problems.append('less than 6 GiB free under /opt/gati')
          info = json.loads(subprocess.check_output(['docker', 'info', '--format', '{{json .}}']))
          if not info.get('MemoryLimit') or not info.get('SwapLimit'):
              problems.append('Docker memory/swap limits unavailable')
          identifiers = subprocess.check_output(['docker', 'network', 'ls', '-q'], text=True).split()
          if identifiers:
              networks = json.loads(subprocess.check_output(['docker', 'network', 'inspect', *identifiers]))
              wanted = [ipaddress.ip_network('172.30.10.0/24'), ipaddress.ip_network('172.30.11.0/24')]
              allowed = {'gati-production_edge', 'gati-production_application'}
              for network in networks:
                  for item in network.get('IPAM', {}).get('Config') or []:
                      if not item.get('Subnet'):
                          continue
                      existing = ipaddress.ip_network(item['Subnet'])
                      if network['Name'] not in allowed and any(existing.overlaps(target) for target in wanted):
                          problems.append('Docker subnet conflict with ' + network['Name'])
          if problems:
              raise SystemExit('VPS prerequisite failure: ' + '; '.join(problems))
          print('VPS host and Docker prerequisites passed.')
          PY
          REMOTE

      - name: Install the pinned build tools
        run: bash scripts/bootstrap.sh

      - name: Install locked project dependencies
        run: |
          source scripts/env.sh
          make deps

      - name: Run the local release gates in the GitHub runner
        run: |
          source scripts/env.sh
          make audit-local COMPOSE='docker compose'
          make security-check

      - name: Prepare and audit the immutable release
        run: |
          source scripts/env.sh
          python3 scripts/release.py prepare --release "$RELEASE_ROOT" --public-host "$GATI_PUBLIC_HOST"
          python3 scripts/audit-images.py --release "$RELEASE_ROOT" --output "${RELEASE_ROOT}-audit"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            -czf "$PACKAGE" -C reports/local \
            "github-release-${GITHUB_SHA}" "github-release-${GITHUB_SHA}-audit"
          (cd "$(dirname "$PACKAGE")" && sha256sum "$(basename "$PACKAGE")") | tee "$PACKAGE.sha256"

      - name: Transfer the verified release package
        run: |
          set -euo pipefail
          scp -C -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$PACKAGE" \
            "$VPS_USER@$VPS_HOST:/tmp/github-release-${GITHUB_SHA}.tar.gz"
          scp -C -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$PACKAGE.sha256" \
            "$VPS_USER@$VPS_HOST:/tmp/github-release-${GITHUB_SHA}.tar.gz.sha256"

      - name: Provision the tunnel credential without exposing it in logs
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_TUNNEL_TOKEN"
          printf '%s' "$CLOUDFLARE_TUNNEL_TOKEN" | \
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'umask 077; install -d -m 700 /opt/gati/releases/.gati-production-runtime; install -m 600 /dev/stdin /opt/gati/releases/.gati-production-runtime/tunnel-token'

      - name: Activate and verify the release on the VPS
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "GATI_SHA='$GITHUB_SHA' REMOTE_ROOT='$REMOTE_ROOT' bash -s" <<'REMOTE'
          set -euo pipefail
          archive="/tmp/github-release-${GATI_SHA}.tar.gz"
          checksum="${archive}.sha256"
          staging="${REMOTE_ROOT}/.incoming-${GATI_SHA}"
          release="${REMOTE_ROOT}/${GATI_SHA}"
          audit="/opt/gati/audits/${GATI_SHA}"
          test -f "$archive" && test -f "$checksum"
          (cd "$(dirname "$archive")" && sha256sum -c "$(basename "$checksum")")
          test ! -e "$staging"
          install -d -m 700 "$REMOTE_ROOT" /opt/gati/audits
          if test -d "$release" && test -d "$audit"; then
            printf 'Reusing the existing immutable release for this revision.\n'
          elif test ! -e "$release" && test ! -e "$audit"; then
            mkdir -m 700 "$staging"
            tar -xzf "$archive" -C "$staging"
            mv "$staging/github-release-${GATI_SHA}" "$release"
            mv "$staging/github-release-${GATI_SHA}-audit" "$audit"
            rmdir "$staging"
          else
            printf 'Incomplete existing release; inspect it before retrying.\n' >&2
            exit 1
          fi
          cd "$release"
          bash scripts/bootstrap.sh
          source scripts/env.sh
          runtime="$REMOTE_ROOT/.gati-production-runtime"
          if [ ! -f "$runtime/vapid.json" ]; then
            go run ./cmd/gati-push-keys -directory "$runtime"
          fi
          python3 - "$release/release.json" "$GATI_SHA" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1]))
          if value.get("source_revision") != sys.argv[2]:
              raise SystemExit("release source revision does not match workflow revision")
          PY
          python3 scripts/release.py verify --release "$release"
          python3 scripts/release.py up --release "$release" --edge --audit "$audit/audit.json"
          python3 scripts/release.py verify --release "$release" --running --edge
          ln -sfn "$release" /opt/gati/.current-new
          mv -Tf /opt/gati/.current-new /opt/gati/current
          rm -f "$archive" "$checksum"
          REMOTE

      - name: Print the deployed revision (no secrets)
        run: echo "Activated $GITHUB_SHA on jamgati.com"

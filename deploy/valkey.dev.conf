# Local scaffold only. API persistence is not connected at this milestone.
bind 0.0.0.0
protected-mode yes
port 6379
save ""
appendonly no
maxmemory 128mb
maxmemory-policy noeviction
dir /data
loglevel warning
# Do not introduce request-level logs or backups of this service.
# Restricted service ACLs and secret provisioning land before participant APIs.
aclfile /run/secrets/users.acl
acllog-max-len 0
slowlog-log-slower-than -1
latency-monitor-threshold 0

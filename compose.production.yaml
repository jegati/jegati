name: gati-production

x-runtime: &runtime
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: {driver: "none"}
  ulimits: {core: 0}
  pids_limit: 256
  restart: unless-stopped

services:
  api: &api
    <<: *runtime
    image: ${GATI_API_IMAGE:-gati-api:local}
    build: {context: ., dockerfile: Dockerfile}
    command: ["-listen", "0.0.0.0:8080", "-config", "/config/gati.yaml", "-store-address", "valkey:6379", "-store-password-file", "/run/secrets/app-password", "-role", "${GATI_API_ROLE:-combined}", "-trusted-proxies", "172.30.11.2/32", "-monitor-socket", "/run/ops/gati.sock", "-push-key-file", "/run/secrets/vapid.json"]
    depends_on:
      valkey: {condition: service_healthy}
    environment: {GOMEMLIMIT: 1GiB}
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 2
    tmpfs: ["/run/ops:uid=10001,gid=10001,mode=0700,size=1m"]
    volumes:
      - ./config/gati.yaml:/config/gati.yaml:ro
      - ${GATI_RUNTIME_DIR:-./.runtime}/app-password:/run/secrets/app-password:ro
    networks: [application, backend]
    healthcheck:
      test: ["CMD", "/gati", "-mode", "health-check", "-listen", "127.0.0.1:8080", "-store-address", "valkey:6379", "-store-password-file", "/run/secrets/app-password"]
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 3

  worker:
    <<: *api
    profiles: [workers]
    command: ["-role", "worker", "-config", "/config/gati.yaml", "-store-address", "valkey:6379", "-store-password-file", "/run/secrets/app-password", "-monitor-socket", "/run/ops/gati.sock", "-push-key-file", "/run/secrets/vapid.json"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "/gati", "-mode", "health-check", "-role", "worker", "-store-address", "valkey:6379", "-store-password-file", "/run/secrets/app-password", "-monitor-socket", "/run/ops/gati.sock"]
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 3

  web:
    <<: *runtime
    image: ${GATI_WEB_IMAGE:-gati-web:local}
    build: {context: ., dockerfile: web/Dockerfile}
    environment: {GATI_PUBLIC_HOST: "${GATI_PUBLIC_HOST:-localhost}"}
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    tmpfs: ["/tmp:size=32m,mode=1777"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      edge: {ipv4_address: 172.30.10.3}
      application: {ipv4_address: 172.30.11.2}

  valkey:
    <<: *runtime
    image: valkey/valkey:9.1.2-alpine@sha256:a0dbf4c1d5708782907c10e2c72deff317518518b5288a58416981d9db95d30b
    command: ["valkey-server", "/etc/valkey/valkey.conf"]
    user: "999:999"
    volumes:
      - ${GATI_VALKEY_CONFIG:-./deploy/valkey.production.conf}:/etc/valkey/valkey.conf:ro
      - ${GATI_RUNTIME_DIR:-./.runtime}/users.acl:/run/secrets/users.acl:ro
      - ${GATI_RUNTIME_DIR:-./.runtime}/health-password:/run/secrets/health-password:ro
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1
    tmpfs: ["/data:size=1m"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "VALKEYCLI_AUTH=$$(cat /run/secrets/health-password) valkey-cli --user health ping"]
      interval: 5s
      timeout: 2s
      retries: 5

  tunnel:
    <<: *runtime
    profiles: [edge]
    image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:2000", "run", "--token-file", "/run/secrets/tunnel-token"]
    volumes: ["${GATI_RUNTIME_DIR:-./.runtime}/tunnel-token:/run/secrets/tunnel-token:ro"]
    depends_on: [web]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    networks:
      edge: {ipv4_address: 172.30.10.2}

networks:
  edge:
    ipam: {config: [{subnet: 172.30.10.0/24, ip_range: 172.30.10.128/25}]}
  application:
    internal: true
    ipam: {config: [{subnet: 172.30.11.0/24, ip_range: 172.30.11.128/25}]}
  backend:
    internal: true
